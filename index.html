<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כרטיסיות מילים לפסיכומטרי</title>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #ECEEDF;
    margin: 0;
    padding: 20px;
}

/* תפריטים */
.select-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    width: 90%;
    max-width: 600px;
    margin-bottom: 20px;
}
select {
    font-size: 18px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid #bbb;
    cursor: pointer;
    background-color: #ffffff;
    color: #333;
    transition: background 0.3s, transform 0.2s;
}
select:hover {
    background-color: #f0f0f0;
    transform: scale(1.03);
}

/* כרטיסייה */
#card {
    width: 90%;
    max-width: 500px;
    height: 300px;
    border-radius: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 42px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: transform 0.6s, box-shadow 0.3s, border 0.3s;
    transform-style: preserve-3d;
    perspective: 1000px;
    position: relative;
    margin-bottom: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    border: 4px solid #bbb;
}
#card:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
#card.flipped { transform: rotateY(180deg); }

.front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 20px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
}
.front {
    background-color: #D9C4B0;
    color: #333;
    border: 2px solid #CFAB8D;
}
.back {
    transform: rotateY(180deg);
    background-color: #BBDCE5;
    color: #333;
    border: 2px solid #CFAB8D;
}

/* כפתורים ניווט */
button {
    margin: 5px;
    font-size: 16px;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
}
button:hover { transform: scale(1.05); }

.nav-buttons button {
    background-color: #CFAB8D;
    color: #333;
}
.nav-buttons button:hover { background-color: #b89370; }

/* כפתורי רמות */
.level-buttons {
    margin: 10px 0;
}
.level-buttons button {
    font-size: 14px;
    padding: 8px 12px;
    color: white;
}
.red { background-color: #e74c3c; }
.orange { background-color: #e67e22; }
.green { background-color: #27ae60; }

/* רספונסיבי */
@media (max-width: 600px) {
    #card { font-size: 28px; height: 220px; }
    select { font-size: 14px; padding: 6px 8px; }
    button { font-size: 14px; padding: 6px 10px; }
}
</style>
</head>
<body>

<div class="select-container">
    <select id="unitSelect"></select>
    <select id="orderSelect">
        <option value="abc">ABC</option>
        <option value="shuffle">Shuffle</option>
    </select>
    <select id="filterSelect">
        <option value="all">כל המילים</option>
        <option value="red">🟥 לא יודע</option>
        <option value="orange">🟧 חלקי</option>
        <option value="green">🟩 יודע</option>
    </select>
</div>

<div id="card">
  <div class="front"></div>
  <div class="back"></div>
</div>

<div class="nav-buttons">
  <button onclick="prevCard()">⬅️</button>
  <button onclick="nextCard()">➡️</button>
</div>

<div class="level-buttons">
  <button class="red" onclick="setLevel('red')">🟥 לא יודע</button>
  <button class="orange" onclick="setLevel('orange')">🟧 חלקי</button>
  <button class="green" onclick="setLevel('green')">🟩 יודע</button>
</div>

<!-- 🔹 כפתור איפוס -->
<div style="margin-top: 10px;">
  <button onclick="resetLevels()" style="background:#666; color:white;">♻️ איפוס רמות ביחידה</button>
</div>

let units = {
  "Unit 1": Unit_1,
  "Unit 2": Unit_2,
  "Unit 3": Unit_3,
  "Unit 4": Unit_4,
  "Unit 5": Unit_5,

// === משתנים ===
let currentUnit = "";
let cards = [];
let currentCard = 0;
let levels = JSON.parse(localStorage.getItem("wordLevels") || "{}");

const card = document.getElementById('card');
const front = card.querySelector('.front');
const back = card.querySelector('.back');
const unitSelect = document.getElementById('unitSelect');
const orderSelect = document.getElementById('orderSelect');
const filterSelect = document.getElementById('filterSelect');

card.addEventListener('click', () => { card.classList.toggle('flipped'); });

// מילוי דרופדאון יחידות
for (let u in units) {
  const opt = document.createElement('option');
  opt.value = u;
  opt.textContent = u;
  unitSelect.appendChild(opt);
}
currentUnit = unitSelect.value;
loadCards();

unitSelect.addEventListener('change', () => { currentUnit = unitSelect.value; loadCards(); });
orderSelect.addEventListener('change', loadCards);
filterSelect.addEventListener('change', loadCards);

function loadCards() {
    cards = [...units[currentUnit]];
    applyOrder();
    applyFilter();
    currentCard = 0;
    showCard();
}

function applyOrder() {
    if(orderSelect.value === "abc") {
        cards.sort((a,b) => a[0].localeCompare(b[0]));
    } else {
        cards.sort(() => Math.random() - 0.5);
    }
}

function applyFilter() {
    if(filterSelect.value === "all") return;
    cards = cards.filter(([eng]) => getLevel(currentUnit, eng) === filterSelect.value);
}

function showCard() {
  if(cards.length === 0) {
    front.textContent = "אין כרטיסים להצגה";
    back.textContent = "";
    card.style.borderColor = "#bbb";
    return;
  }
  card.classList.remove('flipped');
  let [eng, heb] = cards[currentCard];
  front.textContent = eng;
  back.textContent = heb;

  // מסגרת צבע לפי רמה
  let level = getLevel(currentUnit, eng);
  if(level === "red") card.style.borderColor = "#e74c3c";
  else if(level === "orange") card.style.borderColor = "#e67e22";
  else if(level === "green") card.style.borderColor = "#27ae60";
  else card.style.borderColor = "#bbb";
}

function nextCard() {
  if(cards.length === 0) return;
  currentCard = (currentCard + 1) % cards.length;
  showCard();
}
function prevCard() {
  if(cards.length === 0) return;
  currentCard = (currentCard - 1 + cards.length) % cards.length;
  showCard();
}

function setLevel(level) {
  if(cards.length === 0) return;
  let eng = cards[currentCard][0];
  if(!levels[currentUnit]) levels[currentUnit] = {};
  levels[currentUnit][eng] = level;
  localStorage.setItem("wordLevels", JSON.stringify(levels));
  showCard();
}
function getLevel(unit, word) {
  return levels[unit]?.[word] || null;
}

function resetLevels() {
  if (!currentUnit) return;
  if (confirm(`האם לאפס את כל הרמות של ${currentUnit}?`)) {
    levels[currentUnit] = {};
    localStorage.setItem("wordLevels", JSON.stringify(levels));
    loadCards();
  }
}
